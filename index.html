#flash.wasted{background:rgba(0,0,0,.78)}#flash.wasted .t{color:var(--red);text-shadow:0 0 30px #600,0 4px 0 #300;animation:pop .5s}
@keyframes pop{from{transform:scale(1.8);opacity:0}}

<!-- Config de Firebase: en Vercel la genera build.js (firebase-config.js) desde variables de entorno.
     Sin config (apiKey vacío) → modo DEMO con localStorage. -->
<script>
var firebaseConfig = { apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" };
</script>
<script src="firebase-config.js"></script>

<script>
(() => {
'use strict';

/* ================= TIEMPO (America/Buenos_Aires = UTC-3 fijo) ================= */
const OFF = -3 * 3600000, MIN = 60000, DAY = 86400000, BH = 30 * MIN, TOL = 15 * MIN, BUDGET = 12, NB = 48;
const mk = (y, m, d, h = 0, mi = 0) => Date.UTC(y, m - 1, d, h, mi) - OFF;
const LAUNCH = mk(2026, 11, 19);
const dayStart = ts => Math.floor((ts + OFF) / DAY) * DAY - OFF;
const LD = ts => new Date(ts + OFF);
const dkey = ts => LD(ts).toISOString().slice(0, 10);
const dayTs = key => { const [y, m, d] = key.split('-').map(Number); return mk(y, m, d); };
const dow = ts => LD(ts).getUTCDay();
const pad = n => String(n).padStart(2, '0');
const hhmm = ts => pad(LD(ts).getUTCHours()) + ':' + pad(LD(ts).getUTCMinutes());
const DOWS = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
const DOWL = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const dLbl = ts => DOWS[dow(ts)] + ' ' + LD(ts).getUTCDate() + '/' + (LD(ts).getUTCMonth() + 1);
const dLong = ts => DOWL[dow(ts)] + ' ' + LD(ts).getUTCDate() + '/' + (LD(ts).getUTCMonth() + 1);
const bStart = (day, idx) => dayTs(day) + idx * BH;
const bid = (day, idx) => day + '_' + idx;
const idxLbl = i => i >= NB ? '00:00' : pad(Math.floor(i / 2)) + ':' + (i % 2 ? '30' : '00');
const r2 = n => Math.round(n * 100) / 100;
const fmtHr = h => (Math.round(h * 2) / 2) + 'h';
const fmtDur = ms => { const m = Math.round(Math.abs(ms) / MIN); return Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm'; };
const fmtT = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ================= SHA-256 (PIN → hash) ================= */
function sha256(ascii) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a)), mp = Math.pow, mw = mp(2, 32);
  let result = ''; const words = [], abl = ascii.length * 8;
  let hash = sha256.h = sha256.h || []; const k = sha256.k = sha256.k || []; let pc = k.length; const isC = {};
  for (let c = 2; pc < 64; c++) if (!isC[c]) { for (let i = 0; i < 313; i += c) isC[i] = c; hash[pc] = (mp(c, .5) * mw) | 0; k[pc++] = (mp(c, 1 / 3) * mw) | 0; }
  ascii += '\x80'; while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) { const j = ascii.charCodeAt(i); if (j >> 8) return; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = ((abl / mw) | 0); words[words.length] = abl;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16), old = hash; hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] +
        (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? 0 : '') + b.toString(16); }
  return result;
}
const SALT = 'gta6-alcancia:';
const PLAYERS = {
  lauty: { id: 'lauty', name: 'LAUTY', hash: '381d32b2014f3df814b76d932edb991e6cdcfed0a028fe247ed26b88b932332c' },
  fran: { id: 'fran', name: 'FRAN', hash: 'b9dce5b9467f3b585529257e6170f952eb85e715b12925342561938a6f46dc0e' }
};
const other = p => p === 'lauty' ? 'fran' : 'lauty';
const chip = p => `<span class="chip ${p}">${PLAYERS[p]?.name || '?'}</span>`;

/* ================= ESTADO + LÓGICA DE NEGOCIO ================= */
const S = { me: null, tab: 'day', day: null, pin: '', ready: false, loaded: {}, blocks: [], plays: [], trades: [], live: {},
  swap: { give: [], get: [] }, trKind: 'gift', trDir: 'give', scrolled: false };
const COLS = ['blocks', 'plays', 'trades', 'live'];

let _bm = null, _bmV = -1, V = 0;
const bmap = () => { if (_bmV !== V) { _bm = new Map(S.blocks.map(b => [bid(b.day, b.idx), b])); _bmV = V; } return _bm; };

// Presupuesto del día = 12 h ± tradeos aceptados (regalos y préstamos)
function budget(p, day) {
  let h = BUDGET;
  for (const t of S.trades) {
    if (t.status !== 'accepted' || t.type === 'swap') continue;
    const s = p === t.from ? -1 : p === t.to ? 1 : 0; if (!s) continue;
    if (t.day === day) h += s * t.hours;
    if (t.type === 'loan' && t.repayDay === day) h -= s * t.hours;     // devolución: sentido inverso
  }
  return h;
}
const used = (p, day) => S.blocks.filter(b => b.day === day && b.player === p).length / 2;
const avail = (p, day) => budget(p, day) - used(p, day);

function playedMs(b, now) {
  const st = bStart(b.day, b.idx), en = st + BH; let ms = 0;
  for (const p of S.plays) if (p.player === b.player) ms += Math.max(0, Math.min(p.end, en) - Math.max(p.start, st));
  const lv = S.live[b.player]; if (lv && lv.state === 'running') ms += Math.max(0, Math.min(now, en) - Math.max(lv.startedAt, st));
  return ms;
}
function realMs(p, now = Date.now()) {
  let ms = S.plays.filter(x => x.player === p).reduce((a, x) => a + (x.end - x.start), 0);
  const lv = S.live[p]; if (lv && lv.state === 'running') ms += now - lv.startedAt;
  return ms;
}
// estado visual de un bloque ocupado
function blockState(b, now) {
  const st = bStart(b.day, b.idx), en = st + BH, pm = playedMs(b, now), lv = S.live[b.player];
  if (en <= now) return pm > 0 ? { k: 'played', label: `Jugado ${Math.round(pm / MIN)} min` } : { k: 'missed', label: 'Sin usar' };
  if (st <= now) {
    if (lv && lv.state === 'running') return { k: 'live', label: `En curso ▶ ${Math.round(pm / MIN)} min` };
    if (lv && lv.state === 'paused') return { k: 'paused', label: 'En pausa ⏸' };
    return { k: 'reserved', label: `Reservado · se libera ${hhmm(st + TOL)}` };
  }
  return { k: 'reserved', label: 'Reservado' };
}
const reservable = (day, idx, now) => now < bStart(day, idx) + TOL;
const future = (b, now) => bStart(b.day, b.idx) > now;

/* ================= STORE (Firebase o demo localStorage) ================= */
const DEMO = !firebaseConfig.apiKey;
let store;
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
function demoStore() {
  const KEY = 'gta6.demo.v2', ls = new Set();
  let d = { blocks: [], plays: [], trades: [], live: [] };
  const load = () => { try { Object.assign(d, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { } };
  const emit = () => ls.forEach(f => f());
  load(); window.addEventListener('storage', e => { if (e.key === KEY) { load(); emit(); } });
  const apply = o => {
    const a = d[o.col];
    if (o.op === 'set') { const i = a.findIndex(x => x.id === o.id); const v = { ...o.data, id: o.id }; i < 0 ? a.push(v) : a[i] = v; }
    else if (o.op === 'upd') { const x = a.find(x => x.id === o.id); if (x) Object.assign(x, o.data); }
    else if (o.op === 'del') d[o.col] = a.filter(x => x.id !== o.id);
  };
  return {
    async init() { }, newId: rid,
    watch(col, cb) { const f = () => cb(d[col].map(x => ({ ...x }))); ls.add(f); setTimeout(f, 0); },
    async batch(ops) { ops.forEach(apply); save(); emit(); },
    async createIfAbsent(col, id, data) { if (d[col].some(x => x.id === id)) throw new Error('Ese bloque ya está ocupado'); apply({ op: 'set', col, id, data }); save(); emit(); }
  };
}
function fbStore() {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No cargó ' + src)); document.head.appendChild(s); });
  let db;
  return {
    async init() {
      await load(base + 'firebase-app-compat.js'); await load(base + 'firebase-auth-compat.js'); await load(base + 'firebase-firestore-compat.js');
      firebase.initializeApp(firebaseConfig); await firebase.auth().signInAnonymously(); db = firebase.firestore();
    },
    newId: () => db.collection('x').doc().id,
    watch(col, cb) { db.collection(col).onSnapshot(s => cb(s.docs.map(x => ({ ...x.data(), id: x.id }))), e => toast('Firebase: ' + e.message)); },
    batch(ops) {
      const b = db.batch();
      ops.forEach(o => { const r = db.collection(o.col).doc(o.id); o.op === 'set' ? b.set(r, o.data) : o.op === 'upd' ? b.update(r, o.data) : b.delete(r); });
      return b.commit();
    },
    createIfAbsent(col, id, data) {
      const r = db.collection(col).doc(id);

function rangesText(keys) {
  const it = keys.map(k => { const [d, i] = k.split('_'); return { d, i: +i }; }).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.i - b.i);
  const out = []; let g = null;
  for (const x of it) { if (g && g.d === x.d && g.e === x.i) g.e++; else { g = { d: x.d, s: x.i, e: x.i + 1 }; out.push(g); } }
  return out.map(g => `${dLbl(dayTs(g.d))} ${idxLbl(g.s)}–${idxLbl(g.e)}`).join(', ');

async function reserveIdx(idxs, day = dkey(S.day)) {
  const now = Date.now(), me = S.me, bm = bmap();

  if (!free.length) return toast('No hay bloques libres para reservar');
  const a = avail(me, day);
  if (free.length / 2 > a) return toast(`Te quedan ${fmtHr(a)} ese día y querés reservar ${fmtHr(free.length / 2)}`);
  let ok = 0;
  for (const i of free) { try { await store.createIfAbsent('blocks', bid(day, i), { day, idx: i, player: me, createdAt: now }); ok++; } catch (e) { toast(e.message); } }
  if (ok) toast(ok === 1 ? `Reservado ${idxLbl(free[0])}–${idxLbl(free[0] + 1)}` : `${ok} bloques reservados (${fmtHr(ok / 2)})`);
}

    if (!(hours >= .5) || hours * 2 !== Math.round(hours * 2)) return toast('Horas inválidas (múltiplos de 0.5)');
    if (dayTs(day) + DAY <= now) return toast('Ese día ya pasó');
    if (loan && !(repay > day)) return toast('La devolución tiene que ser un día posterior');
    if (S.trDir === 'give' && avail(me, day) < hours) return toast(`Solo tenés ${fmtHr(avail(me, day))} libres ese día`);
    const t = { type: S.trKind, from, to, createdBy: me, status: 'pending', day, hours, note: val('tr-n').trim(), createdAt: now }; if (loan) t.repayDay = repay;
    await act(() => store.batch([{ op: 'set', col: 'trades', id: store.newId(), data: t }]), 'Propuesta enviada');
  },
  async tOk(d) { await acceptTrade(S.trades.find(x => x.id === d.id)); },
  async tNo(d) {
    const ok = await act(() => store.batch([{ op: 'upd', col: 'trades', id: d.id, data: { status: d.s, resolvedAt: Date.now() } }]));
    if (ok) flash('wasted', d.s === 'rejected' ? 'Propuesta rechazada' : 'Propuesta cancelada');
  },
  /* cronómetro */
  async cStart() {
    const me = S.me, lv = S.live[me], ol = S.live[other(me)], now = Date.now();
    if (ol && ol.state === 'running') return toast(`${PLAYERS[other(me)].name} está jugando ahora`);
    if (!lv) {
      const idx = Math.floor((now - dayStart(now)) / BH), cb = bmap().get(bid(dkey(now), idx));
      if (cb && cb.player !== me && !confirm(`El bloque de ahora es de ${PLAYERS[cb.player].name}. ¿Iniciar igual?`)) return;
    }
    const data = lv ? { ...lv, state: 'running', startedAt: now } : { player: me, state: 'running', startedAt: now, accMs: 0, sessionStart: now };
    await act(() => store.batch([{ op: 'set', col: 'live', id: me, data }]));
  },
  async cPause() {
    const me = S.me, lv = S.live[me], now = Date.now(); if (!lv || lv.state !== 'running') return;
    const ops = [{ op: 'set', col: 'live', id: me, data: { ...stripId(lv), state: 'paused', startedAt: null, accMs: (lv.accMs || 0) + now - lv.startedAt } }];
    if (now - lv.startedAt > 1000) ops.push(playOp(me, lv.startedAt, now));
    await act(() => store.batch(ops));
  },
  async cEnd() {
    const me = S.me, lv = S.live[me], now = Date.now(); if (!lv) return;
    let total = lv.accMs || 0; const ops = [];
    if (lv.state === 'running') { total += now - lv.startedAt; if (now - lv.startedAt > 1000) ops.push(playOp(me, lv.startedAt, now)); }
    ops.push({ op: 'del', col: 'live', id: me });
    if (await act(() => store.batch(ops))) flash('passed', `Sesión terminada · ${fmtDur(total)} jugadas`);
  }
};
const stripId = o => { const { id, ...r } = o; return r; };
const playOp = (p, s, e) => ({ op: 'set', col: 'plays', id: store.newId(), data: { player: p, start: s, end: e, minutes: r2((e - s) / MIN), createdAt: e } });

async function acceptTrade(t) {
  if (!t || t.status !== 'pending') return;
  const me = S.me, now = Date.now(), bm = bmap(), ops = [{ op: 'upd', col: 'trades', id: t.id, data: { status: 'accepted', resolvedAt: now } }];
  if (t.type === 'swap') {
    const gb = t.give.map(k => bm.get(k)), tb = t.get.map(k => bm.get(k));
    if (gb.some(b => !b || b.player !== t.createdBy || !future(b, now)) || tb.some(b => !b || b.player !== me || !future(b, now)))
      return toast('El intercambio ya no es válido: cambiaron los bloques. Rechazalo.');
    const delta = {}, add = (p, day, n) => { const k = p + '|' + day; delta[k] = (delta[k] || 0) + n; };
    gb.forEach(b => { add(t.createdBy, b.day, -.5); add(me, b.day, .5); }); tb.forEach(b => { add(me, b.day, -.5); add(t.createdBy, b.day, .5); });
    for (const k in delta) { const [p, day] = k.split('|'); if (used(p, day) + delta[k] > budget(p, day)) return toast(`${PLAYERS[p].name} se pasaría de su saldo el ${dLbl(dayTs(day))}`); }
    gb.forEach(b => ops.push({ op: 'upd', col: 'blocks', id: bid(b.day, b.idx), data: { player: me } }));
    tb.forEach(b => ops.push({ op: 'upd', col: 'blocks', id: bid(b.day, b.idx), data: { player: t.createdBy } }));
  } else {
    if (dayTs(t.day) + DAY <= now) return toast('Ese día ya pasó');
    if (avail(t.from, t.day) < t.hours) return toast(`${PLAYERS[t.from].name} ya no tiene ${fmtHr(t.hours)} libres el ${dLbl(dayTs(t.day))}`);
    if (t.type === 'loan' && avail(t.to, t.repayDay) < t.hours) return toast(`${PLAYERS[t.to].name} no tiene ${fmtHr(t.hours)} libres el ${dLbl(dayTs(t.repayDay))} para devolver`);
  }
  if (await act(() => store.batch(ops))) flash('passed', 'Tradeo aceptado');
}

// No-show: si pasan 15 min del inicio del bloque y el dueño no inició el cronómetro → se libera
let sweeping = new Set();
function sweep() {
  if (!COLS.every(c => S.loaded[c])) return;
  const now = Date.now(), ops = [];
  for (const b of S.blocks) {
    const st = bStart(b.day, b.idx), key = bid(b.day, b.idx);
    if (now < st + TOL || sweeping.has(key)) continue;
    const lv = S.live[b.player];
    const kept = S.plays.some(p => p.player === b.player && p.end > st && p.start < st + TOL) || (lv && lv.sessionStart < st + TOL);
    if (!kept) { ops.push({ op: 'del', col: 'blocks', id: key }); sweeping.add(key); if (b.player === S.me && st + BH > now) flash('wasted', `Se liberó tu bloque ${idxLbl(b.idx)}: no iniciaste el cronómetro a tiempo`); }
  }
  if (ops.length) store.batch(ops).then(() => ops.forEach(o => sweeping.delete(o.id)), () => ops.forEach(o => sweeping.delete(o.id)));
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.id === 'modal') closeModal(); return; }
  const fn = H[el.dataset.act];
  if (fn) { try { const r = fn(el.dataset, el, e); if (r && r.catch) r.catch(err => toast('Error: ' + err.message)); } catch (err) { toast('Error en "' + el.dataset.act + '": ' + err.message); console.error(err); } }
});
window.addEventListener('error', e => toast('Error: ' + e.message));
window.addEventListener('unhandledrejection', e => toast('Error: ' + (e.reason && e.reason.message || e.reason)));

/* ================= LOOP / ARRANQUE ================= */
setInterval(() => {
  const cd = document.getElementById('cd'); if (cd) cd.innerHTML = cdHTML();
  const t = document.getElementById('timer'), lv = S.me && S.live[S.me];
  if (t) t.textContent = fmtT(lv ? (lv.accMs || 0) + (lv.state === 'running' ? Date.now() - lv.startedAt : 0) : 0);
}, 1000);
setInterval(() => { sweep(); if (S.me) render(); }, 20000);

async function boot() {
  $('#app').innerHTML = '<div class="wrap login"><div class="logo" style="text-align:center;font-size:32px">CONECTANDO…</div></div>';
  try { await store.init(); } catch (e) { $('#app').innerHTML = `<div class="wrap"><div class="card">No se pudo conectar con Firebase: ${esc(e.message)}</div></div>`; return; }
  COLS.forEach(c => store.watch(c, arr => {
    if (c === 'live') S.live = Object.fromEntries(arr.map(x => [x.id, x])); else S[c] = arr;
    S.loaded[c] = true; V++; sweep(); render();
  }));
  try { const m = localStorage.getItem('gta6.me'); if (PLAYERS[m]) S.me = m; } catch (e) { }
  S.ready = true; S.day = dayStart(Date.now());
  if (S.me) renderShell(); else $('#app').innerHTML = vLogin();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
store = DEMO ? demoStore() : fbStore();
window.GTA = { S, H, store, budget, used, avail, sweep, bid, dkey, dayStart, mk, sha256, blockState, realMs, reserveIdx, acceptTrade, boot };
boot();
})();
</script>
